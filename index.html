<!doctype html>
<html lang="ja" class="is-splashing">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw behind the iPhone notch; safe-area insets are handled in CSS -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040406" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="My Universe" />
    <!-- Keep this personal app out of search engines (Google etc.) -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="description" content="My Universe — メモやアイデアを星として宇宙に浮かべる、あなただけのノートアプリ。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The wordmark font, so "My Universe" in the opening animation doesn't swap fonts mid-way -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2"
    />
    <title>My Universe</title>
    <script>
      // The opening animation can be turned off in Settings (stored with the other settings).
      try {
        var saved = JSON.parse(localStorage.getItem('my-universe:settings:v1') || 'null');
        if (saved && saved.display && saved.display.splash === false) {
          document.documentElement.className = 'no-splash';
        }
      } catch (e) {
        /* storage blocked: just play the animation */
      }
    </script>
    <style>
      /* Opening animation. Plain CSS, so it starts before the app's JavaScript has loaded.
         Timeline: dust gathers (0–0.7s) → a star is born (0.45–1.2s) → its orbit and planets
         appear (0.75–1.5s) → "My Universe" (0.95–1.6s) → everything fades into the universe (2.1s). */
      html,
      body {
        background: #040406;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse 70% 45% at 50% 45%, rgba(106, 79, 224, 0.14), transparent 70%),
          radial-gradient(ellipse 50% 30% at 30% 75%, rgba(224, 103, 158, 0.08), transparent 70%),
          #030304;
        color: #f7f4ff;
        animation: splash-out 0.55s ease 2.1s forwards;
        -webkit-user-select: none;
        user-select: none;
        cursor: pointer;
      }
      .no-splash #splash {
        display: none;
      }
      #splash.is-skipped {
        animation: splash-out 0.35s ease forwards;
      }
      .splash-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform-origin: 50% 40%;
        animation: splash-zoom 0.55s ease-in 2.1s forwards;
      }
      #splash.is-skipped .splash-stage {
        animation: splash-zoom 0.35s ease-in forwards;
      }
      .splash-mark {
        width: 132px;
        height: 132px;
        overflow: visible;
      }
      .splash-glow {
        transform-origin: 0 0;
        transform: scale(0);
        animation: splash-glow 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.45s forwards;
      }
      .splash-star {
        transform-origin: 0 0;
        transform: scale(0) rotate(-90deg);
        animation: splash-star 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) 0.55s forwards;
      }
      .splash-orbit {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: splash-draw 0.7s ease-out 0.75s forwards;
      }
      .splash-planet {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: splash-pop 0.4s ease-out 1.15s forwards;
      }
      .splash-planet.is-second {
        animation-delay: 1.3s;
      }
      .splash-word {
        margin: 18px 0 0;
        font-family: 'Cormorant Garamond', 'Times New Roman', serif;
        font-style: italic;
        font-weight: 500;
        font-size: 40px;
        line-height: 1.1;
        letter-spacing: 0.02em;
        opacity: 0;
        animation: splash-word 0.75s ease-out 0.95s forwards;
      }
      .splash-tag {
        margin: 10px 0 0;
        font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        font-size: 12px;
        letter-spacing: 0.2em;
        color: #b9b2cf;
        opacity: 0;
        animation: splash-fade 0.6s ease-out 1.25s forwards;
      }
      .splash-dust {
        position: absolute;
        left: 50%;
        top: 40%;
        width: 3px;
        height: 3px;
        margin: -1.5px;
        border-radius: 50%;
        background: var(--c);
        box-shadow: 0 0 6px var(--c);
        opacity: 0;
        animation: splash-gather 0.75s cubic-bezier(0.55, 0, 0.8, 0.4) var(--d) forwards;
      }
      @keyframes splash-gather {
        0% {
          opacity: 0;
          transform: translate(var(--x), var(--y)) scale(1.4);
        }
        25% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(0, 0) scale(0.4);
        }
      }
      @keyframes splash-glow {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        40% {
          transform: scale(1.25);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes splash-star {
        to {
          transform: scale(1) rotate(0deg);
        }
      }
      @keyframes splash-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes splash-pop {
        0% {
          opacity: 0;
          transform: scale(0);
        }
        60% {
          opacity: 1;
          transform: scale(1.5);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes splash-word {
        0% {
          opacity: 0;
          letter-spacing: 0.32em;
          filter: blur(8px);
        }
        100% {
          opacity: 1;
          letter-spacing: 0.02em;
          filter: blur(0);
        }
      }
      @keyframes splash-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes splash-out {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
      @keyframes splash-zoom {
        to {
          transform: scale(1.12);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          animation-delay: 0.8s;
        }
        .splash-glow,
        .splash-star,
        .splash-orbit,
        .splash-planet,
        .splash-word,
        .splash-tag,
        .splash-stage {
          animation: none;
          opacity: 1;
          transform: none;
          stroke-dashoffset: 0;
        }
        .splash-dust {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <span class="splash-dust" style="--x: -150px; --y: -190px; --d: 0s; --c: #ffe3a0"></span>
      <span class="splash-dust" style="--x: 160px; --y: -170px; --d: 0.05s; --c: #a5e6ff"></span>
      <span class="splash-dust" style="--x: 210px; --y: 30px; --d: 0.1s; --c: #ffb4d0"></span>
      <span class="splash-dust" style="--x: 120px; --y: 210px; --d: 0.02s; --c: #d4c6ff"></span>
      <span class="splash-dust" style="--x: -110px; --y: 230px; --d: 0.08s; --c: #b4f2d2"></span>
      <span class="splash-dust" style="--x: -220px; --y: 40px; --d: 0.12s; --c: #ffffff"></span>
      <span class="splash-dust" style="--x: -60px; --y: -250px; --d: 0.15s; --c: #ffffff"></span>
      <span class="splash-dust" style="--x: 250px; --y: -80px; --d: 0.18s; --c: #ffffff"></span>
      <span class="splash-dust" style="--x: 40px; --y: 270px; --d: 0.14s; --c: #ffe3a0"></span>
      <span class="splash-dust" style="--x: -240px; --y: -110px; --d: 0.2s; --c: #d4c6ff"></span>
      <span class="splash-dust" style="--x: 190px; --y: 160px; --d: 0.22s; --c: #ffffff"></span>
      <span class="splash-dust" style="--x: -180px; --y: 170px; --d: 0.24s; --c: #a5e6ff"></span>
      <div class="splash-stage">
        <svg class="splash-mark" viewBox="-50 -50 100 100">
          <defs>
            <radialGradient id="splash-glow">
              <stop offset="0%" stop-color="#fff4da" stop-opacity="0.95" />
              <stop offset="22%" stop-color="#ffb4d0" stop-opacity="0.42" />
              <stop offset="55%" stop-color="#8a68f0" stop-opacity="0.18" />
              <stop offset="100%" stop-color="#8a68f0" stop-opacity="0" />
            </radialGradient>
          </defs>
          <circle class="splash-glow" r="48" fill="url(#splash-glow)" />
          <g transform="rotate(-24)">
            <ellipse class="splash-orbit" rx="38" ry="12" pathLength="100" fill="none" stroke="#d7ccff" stroke-opacity="0.6" stroke-width="1.6" />
          </g>
          <path
            class="splash-star"
            d="M0 -26C2.6 -6.5 6.5 -2.6 26 0C6.5 2.6 2.6 6.5 0 26C-2.6 6.5 -6.5 2.6 -26 0C-6.5 -2.6 -2.6 -6.5 0 -26Z"
            fill="#fff8ea"
          />
          <circle class="splash-planet" cx="29.4" cy="-18.6" r="3.4" fill="#a5e6ff" />
          <circle class="splash-planet is-second" cx="-31" cy="18.3" r="2.6" fill="#ffb4d0" />
        </svg>
        <p class="splash-word">My Universe</p>
        <p class="splash-tag">あなたのアイデアで、あなただけの宇宙を。</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
