<!doctype html>
<html lang="ja" class="is-splashing">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw behind the iPhone notch; safe-area insets are handled in CSS -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Asterism" />
    <!-- Keep this personal app out of search engines (Google etc.) -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="description" content="Asterism — 気軽に書けて、メモ同士をつなげられるノートアプリ。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The wordmark font (Inter ExtraBold), so "Asterism" in the opening animation doesn't swap fonts mid-way -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2"
    />
    <title>Asterism</title>
    <script>
      // The opening animation can be turned off in Settings (stored with the other settings).
      try {
        var saved = JSON.parse(localStorage.getItem('my-universe:settings:v1') || 'null');
        if (saved && saved.display && saved.display.splash === false) {
          document.documentElement.className = 'no-splash';
        }
      } catch (e) {
        /* storage blocked: just play the animation */
      }
    </script>
    <style>
      /* Opening animation. Plain CSS, so it starts before the app's JavaScript has loaded.
         Timeline: dust gathers (0–0.7s) → a star is born (0.45–1.2s) → its orbit and planets
         appear (0.75–1.5s) → "Asterism" (0.95–1.6s) → everything fades into the app (2.1s). */
      html,
      body {
        background: #ffffff;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #ffffff;
        color: #111111;
        animation: splash-out 0.55s ease 2.1s forwards;
        -webkit-user-select: none;
        user-select: none;
        cursor: pointer;
      }
      .no-splash #splash {
        display: none;
      }
      #splash.is-skipped {
        animation: splash-out 0.35s ease forwards;
      }
      .splash-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform-origin: 50% 40%;
        animation: splash-zoom 0.55s ease-in 2.1s forwards;
      }
      #splash.is-skipped .splash-stage {
        animation: splash-zoom 0.35s ease-in forwards;
      }
      .splash-mark {
        width: 132px;
        height: 132px;
        overflow: visible;
      }
      .splash-glow {
        transform-origin: 0 0;
        transform: scale(0);
        animation: splash-glow 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.45s forwards;
      }
      .splash-star {
        transform-origin: 0 0;
        transform: scale(0) rotate(-90deg);
        animation: splash-star 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) 0.55s forwards;
      }
      .splash-orbit {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: splash-draw 0.7s ease-out 0.75s forwards;
      }
      .splash-planet {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: splash-pop 0.4s ease-out 1.15s forwards;
      }
      .splash-planet.is-second {
        animation-delay: 1.3s;
      }
      .splash-word {
        margin: 18px 0 0;
        font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 40px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        opacity: 0;
        animation: splash-word 0.75s ease-out 0.95s forwards;
      }
      .splash-tag {
        margin: 10px 0 0;
        font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic UI', Meiryo, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.16em;
        color: #666666;
        opacity: 0;
        animation: splash-fade 0.6s ease-out 1.25s forwards;
      }
      .splash-dust {
        position: absolute;
        left: 50%;
        top: 40%;
        width: 3px;
        height: 3px;
        margin: -1.5px;
        border-radius: 50%;
        background: var(--c);
        box-shadow: none;
        opacity: 0;
        animation: splash-gather 0.75s cubic-bezier(0.55, 0, 0.8, 0.4) var(--d) forwards;
      }
      @keyframes splash-gather {
        0% {
          opacity: 0;
          transform: translate(var(--x), var(--y)) scale(1.4);
        }
        25% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(0, 0) scale(0.4);
        }
      }
      @keyframes splash-glow {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        40% {
          transform: scale(1.25);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes splash-star {
        to {
          transform: scale(1) rotate(0deg);
        }
      }
      @keyframes splash-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes splash-pop {
        0% {
          opacity: 0;
          transform: scale(0);
        }
        60% {
          opacity: 1;
          transform: scale(1.5);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes splash-word {
        0% {
          opacity: 0;
          letter-spacing: 0.24em;
          filter: blur(8px);
        }
        100% {
          opacity: 1;
          letter-spacing: -0.02em;
          filter: blur(0);
        }
      }
      @keyframes splash-fade {
        to {
          opacity: 1;
        }
      }
      @keyframes splash-out {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
      @keyframes splash-zoom {
        to {
          transform: scale(1.12);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          animation-delay: 0.8s;
        }
        .splash-glow,
        .splash-star,
        .splash-orbit,
        .splash-planet,
        .splash-word,
        .splash-tag,
        .splash-stage {
          animation: none;
          opacity: 1;
          transform: none;
          stroke-dashoffset: 0;
        }
        .splash-dust {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <span class="splash-dust" style="--x: -150px; --y: -190px; --d: 0s; --c: #111111"></span>
      <span class="splash-dust" style="--x: 160px; --y: -170px; --d: 0.05s; --c: #111111"></span>
      <span class="splash-dust" style="--x: 210px; --y: 30px; --d: 0.1s; --c: #111111"></span>
      <span class="splash-dust" style="--x: 120px; --y: 210px; --d: 0.02s; --c: #111111"></span>
      <span class="splash-dust" style="--x: -110px; --y: 230px; --d: 0.08s; --c: #111111"></span>
      <span class="splash-dust" style="--x: -220px; --y: 40px; --d: 0.12s; --c: #111111"></span>
      <span class="splash-dust" style="--x: -60px; --y: -250px; --d: 0.15s; --c: #111111"></span>
      <span class="splash-dust" style="--x: 250px; --y: -80px; --d: 0.18s; --c: #111111"></span>
      <span class="splash-dust" style="--x: 40px; --y: 270px; --d: 0.14s; --c: #111111"></span>
      <span class="splash-dust" style="--x: -240px; --y: -110px; --d: 0.2s; --c: #111111"></span>
      <span class="splash-dust" style="--x: 190px; --y: 160px; --d: 0.22s; --c: #111111"></span>
      <span class="splash-dust" style="--x: -180px; --y: 170px; --d: 0.24s; --c: #111111"></span>
      <div class="splash-stage">
        <svg class="splash-mark" viewBox="-50 -50 100 100">
          <circle class="splash-glow" r="40" fill="#111111" fill-opacity="0.045" />
          <g transform="rotate(-24)">
            <ellipse class="splash-orbit" rx="40" ry="12.5" pathLength="100" fill="none" stroke="#111111" stroke-width="2.4" />
          </g>
          <path
            class="splash-star"
            d="M0 -30C3 -7.5 7.5 -3 30 0C7.5 3 3 7.5 0 30C-3 7.5 -7.5 3 -30 0C-7.5 -3 -3 -7.5 0 -30Z"
            fill="#111111"
          />
          <circle class="splash-planet" cx="31" cy="-19.6" r="4.2" fill="#111111" />
          <circle class="splash-planet is-second" cx="-32.6" cy="19.3" r="3.2" fill="#111111" />
        </svg>
        <p class="splash-word">Asterism</p>
        <p class="splash-tag">メモをつないで、あなたの星図に。</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
