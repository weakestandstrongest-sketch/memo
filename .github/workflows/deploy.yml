# Builds, tests and publishes Asterism to GitHub Pages (free HTTPS hosting).
#
# - Every push / pull request: type-check, unit tests and a production build.
# - Pushes to the repository's default branch: the build is also published to
#   https://<user>.github.io/<repository>/
#
# One-time setup (see README): Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The site lives under /<repository-name>/ on GitHub Pages, so asset URLs need that prefix.
      - name: Build
        run: npx vite build --base "/${{ github.event.repository.name }}/"

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # Only publish from the default branch (not from pull requests or other branches).
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
